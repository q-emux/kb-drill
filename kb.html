r whether we're moving too fast."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "someone is… some other people is…", "d": [["Cornice inglese", "Some people… others…"], ["Esempio", "Some people are adapting; others are pushing back."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "the situation is a mix of both", "d": [["Cornice inglese", "It's a bit of both."], ["Esempio", "\"Adapting or resisting?\" \"It's a bit of both.\""]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "I think that the main risk is…", "d": [["Cornice inglese", "My main concern is…"], ["Esempio", "My main concern is quality, not speed."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "we are passing through (a reorganization)", "d": [["Cornice inglese", "We're going through…"], ["Esempio", "We're going through a major reorganization."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "as always they did before", "d": [["Cornice inglese", "the way they always have"], ["Esempio", "They want to keep working the way they always have."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "that ones that…", "d": [["Cornice inglese", "the ones who… / those who…"], ["Esempio", "The ones who resist change usually pay for it later."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "it should be a mistake", "d": [["Cornice inglese", "There must be (a mistake)…"], ["Esempio", "There must be a mistake — I only booked one night."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "they are weeks that I…", "d": [["Cornice inglese", "It's been weeks since… / …for weeks"], ["Esempio", "It's been weeks since I last heard from him. / I've been trying to sort this out for weeks."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "what it matters is…", "d": [["Cornice inglese", "What matters is…"], ["Esempio", "What matters is that we deliver on time."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "the most of time", "d": [["Cornice inglese", "most of the time"], ["Esempio", "Most of the time it works fine."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "the team is composed by five people", "d": [["Cornice inglese", "be made up of"], ["Esempio", "The team is made up of five people."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "in challenge with yourself", "d": [["Cornice inglese", "competing against yourself"], ["Esempio", "Running is about competing against yourself."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "I'm not so able to finish things", "d": [["Cornice inglese", "I'm not very good at + -ing"], ["Esempio", "I'm not very good at dropping things I've started."]]}, {"c": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "s": "CHUNKS", "t": "Cornici anti-calco — l'impalcatura inglese al posto della traduzione", "d": [["", "*Contromosse dirette ai calchi strutturali documentati nelle produzioni. Uso: quando in conversazione sto per costruire la frase all'italiana (colonna 1), aggancio la cornice (colonna 2) e la riempio. Tutte ⭐ per definizione: sono qui perché il calco corrispondente è ricorrente.*\n---"]], "p": 1}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I think...", "d": [["Provo prima a dire...", "I'd say..."], ["⭐", "⭐⭐⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I like...", "d": [["Provo prima a dire...", "I'm quite fond of..."], ["⭐", "⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I prefer...", "d": [["Provo prima a dire...", "I'd rather... / I'm more inclined to..."], ["⭐", "⭐⭐⭐⭐⭐"], ["Note", "rather + verbo base (I'd rather walk); inclined to + infinito — più formale e morbido"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I'd choose...", "d": [["Provo prima a dire...", "I'd probably opt for..."], ["⭐", "⭐⭐⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "Better", "d": [["Provo prima a dire...", "More effective / more beneficial"], ["⭐", "⭐⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "Because...", "d": [["Provo prima a dire...", "That's because... / The reason is that..."], ["⭐", "⭐⭐⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "But...", "d": [["Provo prima a dire...", "Having said that..."], ["⭐", "⭐⭐⭐⭐⭐"], ["Note", "cfr. that being said (Chunks)"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "Maybe...", "d": [["Provo prima a dire...", "It depends."], ["⭐", "⭐⭐⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "Instead of...", "d": [["Provo prima a dire...", "Rather than..."], ["⭐", "⭐⭐⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I want... (richiesta / desiderio)", "d": [["Provo prima a dire...", "I'd like to..."], ["⭐", "⭐⭐⭐⭐"], ["Note", "cortesia: ammorbidisce la richiesta — I'd like to change my reservation."]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I want... (obiettivo / piano)", "d": [["Provo prima a dire...", "I'm looking to..."], ["⭐", "⭐⭐⭐⭐"], ["Note", "puntare a / avere in programma di — We're looking to expand the team."]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I'll show you...", "d": [["Provo prima a dire...", "Let me walk you through..."], ["⭐", "⭐⭐⭐⭐⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "We found a problem", "d": [["Provo prima a dire...", "We ran into an issue."], ["⭐", "⭐⭐⭐⭐⭐"], ["Note", "→ run into (Phrasal)"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "We met someone by chance", "d": [["Provo prima a dire...", "We bumped into..."], ["⭐", "⭐⭐⭐⭐"], ["Note", "→ bump into (Phrasal)"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "I can't tolerate...", "d": [["Provo prima a dire...", "I can't put up with..."], ["⭐", "⭐⭐⭐⭐"], ["Note", "→ put up with (Phrasal ⭐)"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "Keep in mind...", "d": [["Provo prima a dire...", "Bear in mind..."], ["⭐", "⭐⭐⭐⭐"], ["Note", "→ bear in mind (Idiom ⭐)"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "postpone", "d": [["Provo prima a dire...", "put off / move back"], ["⭐", "⭐⭐⭐⭐"], ["Note", "latinate → phrasal; put off = rimandare in generale, move back = spostare una data"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "investigate", "d": [["Provo prima a dire...", "look into"], ["⭐", "⭐⭐⭐⭐"], ["Note", "latinate → phrasal; → Phrasal ⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "continue", "d": [["Provo prima a dire...", "carry on"], ["⭐", "⭐⭐⭐⭐"], ["Note", "latinate → phrasal; → Phrasal ⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "discover / understand", "d": [["Provo prima a dire...", "figure out"], ["⭐", "⭐⭐⭐⭐"], ["Note", "latinate → phrasal; → Phrasal ⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "organize / resolve", "d": [["Provo prima a dire...", "sort out"], ["⭐", "⭐⭐⭐⭐"], ["Note", "latinate → phrasal; → Phrasal ⭐"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "eliminate", "d": [["Provo prima a dire...", "get rid of / weed out"], ["⭐", "⭐⭐⭐"], ["Note", "latinate → phrasal; weed out = selettivo: scartare i peggiori da un insieme"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "return to (a topic)", "d": [["Provo prima a dire...", "go over / get back to"], ["⭐", "⭐⭐⭐"], ["Note", "go over = rivedere/esaminare; get back to = riprenderci più tardi (anche: I'll get back to you = ti faccio sapere)"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "very + adjective", "d": [["Provo prima a dire...", "utterly / remarkably / somewhat"], ["⭐", "⭐⭐⭐⭐"], ["Note", "utterly = assoluto (con agg. forti), remarkably = notevolmente, somewhat = ATTENUA — cfr. Intensificatori"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "some time ago", "d": [["Provo prima a dire...", "a while back"], ["⭐", "⭐⭐⭐"], ["Note", "più naturale e parlato di some time ago"]]}, {"c": "Riflessi attivi", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "in my opinion", "d": [["Provo prima a dire...", "from where I stand / the way I see it"], ["⭐", "⭐⭐⭐⭐"], ["Note", "cfr. Chunks"]]}, {"c": "Stabilizzati (riflessi ormai spontanei — solo review)", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "(nessuno ancora)", "d": []}, {"c": "Stabilizzati (riflessi ormai spontanei — solo review)", "s": "UPGRADE REFLEXES (B2 → C1)", "t": "Stabilizzati (riflessi ormai spontanei — solo review)", "d": [["", "---"]], "p": 1}, {"c": "Conditionals", "s": "VERB FORMS", "t": "0 Conditional", "d": [["Structure", "If + present simple → present simple"], ["Use", "Facts always true, natural laws"], ["Example", "If you heat water to 100°C, it boils."]]}, {"c": "Conditionals", "s": "VERB FORMS", "t": "1st Conditional", "d": [["Structure", "If + present simple → will + base verb"], ["Use", "Real, possible future"], ["Example", "If it rains tomorrow, I'll take the bus."]]}, {"c": "Conditionals", "s": "VERB FORMS", "t": "2nd Conditional", "d": [["Structure", "If + past simple → would + base verb"], ["Use", "Unreal situations in the present/future"], ["Example", "If I had more time, I would learn Japanese."]]}, {"c": "Conditionals", "s": "VERB FORMS", "t": "3rd Conditional", "d": [["Structure", "If + past perfect → would have + past participle"], ["Use", "Unreal situations in the past"], ["Example", "If she had prepared better, she would have passed."]]}, {"c": "Conditionals", "s": "VERB FORMS", "t": "Mixed (past → present)", "d": [["Structure", "If + past perfect → would + base verb"], ["Use", "Past mistake → present consequence"], ["Example", "If I had studied medicine, I would be a doctor now."]]}, {"c": "Conditionals", "s": "VERB FORMS", "t": "Mixed (present → past)", "d": [["Structure", "If + past simple → would have + past participle"], ["Use", "Current situation → past consequence"], ["Example", "If I weren't so shy, I would have spoken to him at the party."]]}, {"c": "Conditionals", "s": "VERB FORMS", "t": "Conditionals", "d": [["", "---"]], "p": 1}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "enjoy doing → I enjoy reading novels.", "d": [["Only TO + Infinitive", "agree to do → She agreed to help."], ["Both (meaning changes)", "remember to do = don't forget to do (Remember to lock the door.)"]]}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "avoid doing → He avoided talking to her.", "d": [["Only TO + Infinitive", "decide to do → They decided to leave."], ["Both (meaning changes)", "remember doing = recall a past experience (I remember locking the door.)"]]}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "suggest doing → She suggested going out.", "d": [["Only TO + Infinitive", "hope to do → I hope to pass the exam."], ["Both (meaning changes)", "stop to do = pause to do sth else (He stopped to smoke.)"]]}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "finish doing → They finished working at 6.", "d": [["Only TO + Infinitive", "want to do → I want to eat now."], ["Both (meaning changes)", "stop doing = cease doing (He stopped smoking.)"]]}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "mind doing → Do you mind opening the window?", "d": [["Only TO + Infinitive", "promise to do → He promised to call."], ["Both (meaning changes)", "try to do = attempt with effort (I tried to lift the box.)"]]}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "keep (on) doing → She keeps complaining.", "d": [["Only TO + Infinitive", "refuse to do → He refused to pay."], ["Both (meaning changes)", "try doing = experiment with sth (Try adding some lemon.)"]]}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "avoid, suggest, finish, mind, keep on, enjoy", "d": [["Only TO + Infinitive", "agree, decide, hope, want, promise, refuse"], ["Both (meaning changes)", "regret to do = be sorry about sth you're about to say (I regret to inform you…)"]]}, {"c": "-ING vs TO + Infinitive", "s": "VERB FORMS", "t": "-ING vs TO + Infinitive", "d": [["", "**REGOLA GENERALE per i verbi con doppia costruzione** (remember, forget, regret, stop, try, go on):\n- **+ infinitive** → guarda **avanti** nel tempo (azione ancora da fare / scopo)\n- **+ -ing** → guarda **indietro** nel tempo (azione già compiuta)\n**Esempi:**\nRemember **to call** her tomorrow! (futuro) / I remember **calling** her yesterday. (passato)\nI forgot **to lock** the door. (non l'ho fatto) / I'll never forget **meeting** you. (ricordo passato)\nI regret **to inform** you... (formale, sto per dire qc) / I regret **telling** her the truth. (passato)\n**Eccezione**:\n**stop + infinitive** "]], "p": 1}, {"c": "Future Forms", "s": "VERB FORMS", "t": "🤔 Think (decide now)", "d": [["Form", "will + base verb"], ["Use", "Spontaneous decision made in the moment"], ["Example", "\"It's cold.\" — \"I'll close the window.\""]]}, {"c": "Future Forms", "s": "VERB FORMS", "t": "💭 Plan (already decided)", "d": [["Form", "going to + base verb"], ["Use", "Prior intention / plan already made"], ["Example", "I'm going to apply for that position next week."]]}, {"c": "Future Forms", "s": "VERB FORMS", "t": "📅 Schedule (already arranged, 100%)", "d": [["Form", "Present continuous"], ["Use", "Fixed arrangement in the near future"], ["Example", "I'm meeting the client on Thursday at 10."]]}, {"c": "Future Forms", "s": "VERB FORMS", "t": "Future Forms", "d": [["", "**Note from handwritten notes:**\n- **will** = spontaneous decision\n- **going to** = decided but not fully planned\n- **-ing** = fully planned and fixed\n- Auxiliary verbs of **going to** (gonna) do NOT carry meaning — they only express the mood\n---"]], "p": 1}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "should", "d": [["Meaning", "advice / moral obligation"], ["Example", "You should study more."], ["Past Form", "should have"], ["Past Meaning", "regret / error"], ["Past Example", "I should have studied more."]]}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "would", "d": [["Meaning", "conditional / desire"], ["Example", "I would go home."], ["Past Form", "would have"], ["Past Meaning", "hypothetical result"], ["Past Example", "I would have gone if I'd known."]]}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "could", "d": [["Meaning", "possibility / ability"], ["Example", "I could help you."], ["Past Form", "could have"], ["Past Meaning", "missed possibility"], ["Past Example", "I could have helped — I just didn't."]]}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "must", "d": [["Meaning", "strong deduction / obligation"], ["Example", "She must be tired."], ["Past Form", "must have"], ["Past Meaning", "near certainty"], ["Past Example", "She must have left early."]]}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "may", "d": [["Meaning", "possibility (more probable)"], ["Example", "It may rain."], ["Past Form", "may have"], ["Past Meaning", "possible past event"], ["Past Example", "She may have forgotten."]]}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "might", "d": [["Meaning", "weaker possibility"], ["Example", "It might rain."], ["Past Form", "might have"], ["Past Meaning", "less certain past event"], ["Past Example", "She might have forgotten."]]}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "can't", "d": [["Meaning", "impossibility / \"mica\""], ["Example", "He can't be serious."], ["Past Form", "can't have"], ["Past Meaning", "impossibility in the past"], ["Past Example", "She can't have heard the announcement — she was wearing headphones."]]}, {"c": "Modal Verbs — Regrets & Deductions", "s": "VERB FORMS", "t": "Modal Verbs — Regrets & Deductions", "d": [["", "**REGRET + -ING form**: I regret not attending the meeting. / She regrets saying that.\n**Scala di certezza nella deduzione:** *must* (quasi certo che sia così) → *may* (possibile) → *might / could* (meno probabile) → *can't* (certezza che NON sia così).\n**Regola operativa:** i modali non cambiano con la persona e non hanno una forma propria per il passato. Per parlare del passato: **MODAL + HAVE + PAST PARTICIPLE**, sempre. · *She must have left.* · *He can't have known.*\n**SHOULD have** ha un valore a parte: colpa personale, giudizio col senno di poi (*hindsight*). · *I should have told her.*"]], "p": 1}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Present simple", "d": [["Reported speech (passato)", "Past simple"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Present continuous", "d": [["Reported speech (passato)", "Past continuous"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Present perfect", "d": [["Reported speech (passato)", "Past perfect"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Past simple", "d": [["Reported speech (passato)", "Past perfect"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Past continuous", "d": [["Reported speech (passato)", "Past perfect continuous"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Will", "d": [["Reported speech (passato)", "Would"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Can", "d": [["Reported speech (passato)", "Could"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "May / Might", "d": [["Reported speech (passato)", "Might"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Must", "d": [["Reported speech (passato)", "Had to"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "I hope nobody will ask questions.", "d": [["Past (reported/narrative)", "I hoped nobody would ask questions."]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "I know he will understand.", "d": [["Past (reported/narrative)", "I knew he would understand."]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "She says she will help me.", "d": [["Past (reported/narrative)", "She said she would help me."]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "now", "d": [["Reported", "then / at that time"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "today", "d": [["Reported", "that day"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "tomorrow", "d": [["Reported", "the next day"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "yesterday", "d": [["Reported", "the day before"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "this", "d": [["Reported", "that"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "here", "d": [["Reported", "there"]]}, {"c": "Reported Speech — Sequenza dei Tempi", "s": "VERB FORMS", "t": "Reported Speech — Sequenza dei Tempi", "d": [["", "Quando si riferisce ciò che qualcuno ha detto al passato (*he said, she told me*), i tempi verbali \"arretrano\" di un grado:\n**Esempi:**\n- \"I **work** here.\" → He said he **worked** there.\n- \"I **am working** on it.\" → She said she **was working** on it.\n- \"I **have moved** to Berlin.\" → He said he **had moved** to Berlin.\n- \"I **will call** you.\" → She said she **would call** me.\n- \"I **can** help.\" → He said he **could** help.\n**\"Would\" come Future in the Past:**\nQuando si parla del passato e ci si riferisce a qualcosa che sarebbe accaduto dopo, si usa **would** invece di *will*:\n**Pronomi e "]], "p": 1}, {"c": "Subjunctive (C1) — due casi principali", "s": "VERB FORMS", "t": "Subjunctive (C1) — due casi principali", "d": [["", "In inglese il subjunctive emerge in due contesti specifici dove la grammatica \"diventa indipendente\" dai tempi normali.\n**1. Dopo verbi di consiglio / proposta / richiesta:**\nCon **suggest, recommend, insist, propose, demand, request** + soggetto → **base verb** (anche se il verbo principale è al passato).\n❌ She suggested me **to call** → ✅ She suggested **(that) I call**\n❌ He insisted that we **came** → ✅ He insisted that we **come**\n❌ They demanded that he **left** → ✅ They demanded that he **leave**\nAlternativa: *suggest/recommend + -ing* (es. *She suggested calling*).\n**2. Dopo \"it's time\""]], "p": 1}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Present simple", "d": [["Active", "He delivers packages."], ["Passive", "Packages are delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Present continuous", "d": [["Active", "He is delivering the package."], ["Passive", "The package is being delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Present perfect", "d": [["Active", "He has delivered the package."], ["Passive", "The package has been delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Past simple", "d": [["Active", "He delivered the package."], ["Passive", "The package was delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Past continuous", "d": [["Active", "He was delivering the package."], ["Passive", "The package was being delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Past perfect", "d": [["Active", "He had delivered the package."], ["Passive", "The package had been delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Future (will)", "d": [["Active", "He will deliver the package."], ["Passive", "The package will be delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Future perfect", "d": [["Active", "He will have delivered the package."], ["Passive", "The package will have been delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Modals", "d": [["Active", "He must deliver the package."], ["Passive", "The package must be delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Modals + perfect", "d": [["Active", "He must have delivered the package."], ["Passive", "The package must have been delivered."]]}, {"c": "Passive Form — Sintesi", "s": "VERB FORMS", "t": "Passive Form — Sintesi", "d": [["", "**Struttura base:** *to be* + past participle\n**Uso del passivo:**\n- Quando l'**oggetto** dell'azione è più importante del soggetto: *The package was delivered.*\n- Quando il soggetto è sconosciuto/irrilevante: *My car was stolen.*\n- In contesti formali/giornalistici: *Three people were injured.*\n- Per evitare attribuzioni dirette: *Mistakes were made.*\n**Con preposizione *by* (per indicare chi compie l'azione):**\n- *The novel was written **by** Hemingway.*\n- *The meeting was organised **by** Sarah.*\n**Frasi con doppia struttura passive (con verbi come *say, believe, think, know*):**\n- *It is s"]], "p": 1}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "I wish I had + PP ⭐", "d": [["Uso", "rimpianto puro nel passato"], ["Esempio", "I wish I had taken that opportunity."]]}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "If only I had + PP ⭐", "d": [["Uso", "rimpianto enfatico"], ["Esempio", "If only I had listened to her advice!"]]}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "I should have + PP ⭐", "d": [["Uso", "rimpianto con obbligo morale non rispettato"], ["Esempio", "I should have called her sooner."]]}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "I regret + -ing", "d": [["Uso", "rimpianto su un'azione passata"], ["Esempio", "I regret not keeping in touch."]]}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "If I could go back in time, I would have...", "d": [["Uso", "rimpianto ipotetico drammatico"], ["Esempio", "If I could go back in time, I would have studied abroad."]]}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "Looking back...", "d": [["Uso", "introduce un rimpianto"], ["Esempio", "Looking back, I wish I had spent more time with family."]]}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "In hindsight / With hindsight...", "d": [["Uso", "col senno di poi"], ["Esempio", "In hindsight, I wouldn't make the same choice."]]}, {"c": "Wishes & Regrets — Strutture per il Rimpianto", "s": "VERB FORMS", "t": "Wishes & Regrets — Strutture per il Rimpianto", "d": [["", "**⚠️ Nota cruciale:** ***I would have + PP*** da solo NON esprime rimpianto — è solo conseguenza condizionale (richiede un *if*). Per esprimere rimpianto puro, usa **wish / if only / should have**.\n---"]], "p": 1}, {"c": "Present Perfect Continuous", "s": "VERB FORMS", "t": "have/has been + verb-ing", "d": [["Use", "action in progress for a duration up to now"], ["Example", "I've been working on this project for three months."]]}, {"c": "Present Perfect Continuous", "s": "VERB FORMS", "t": "How long have you been…?", "d": [["Use", "asking about duration of ongoing action"], ["Example", "How long have you been learning English?"]]}, {"c": "Present Perfect Continuous", "s": "VERB FORMS", "t": "Who/what have you been …-ing?", "d": [["Use", "describing ongoing collaborations / activities"], ["Example", "What have you been working on lately?"]]}, {"c": "Present Perfect Continuous", "s": "VERB FORMS", "t": "Present Perfect Continuous", "d": [["", "**NOTE from handwritten notes:**\n- \"How are you? What are you working on?\" → contatto frequente + informale + lavorativo\n- \"How have you been? What have you been working on?\" → dopo un po' che non si vede (interessa un PERIODO, non solo il momento attuale)\n---"]], "p": 1}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get tired / get bored", "d": [["Meaning", "become tired / bored"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get excited / get nervous", "d": [["Meaning", "become excited / nervous"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get confused / get lost", "d": [["Meaning", "become confused / lose one's way"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get better / get worse", "d": [["Meaning", "improve / deteriorate"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get dressed / get ready", "d": [["Meaning", "dress oneself / prepare"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get drunk / get sick", "d": [["Meaning", "become intoxicated / unwell"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get angry / get mad", "d": [["Meaning", "become angry"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get older / get taller", "d": [["Meaning", "grow older / taller"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get anxious / get embarrassed", "d": [["Meaning", "become anxious / embarrassed"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "get sleepy / get stuck", "d": [["Meaning", "become sleepy / stuck"]]}, {"c": "Describing Changes with GET", "s": "VERB FORMS", "t": "Describing Changes with GET", "d": [["", "**GET + adjective** = to become / to change state:\n**GET + adjective vs MAKE + me + adjective:**\n- GET + adj = uno diventa (cambiamento interno)\n- MAKE + me + adj = qualcosa/qualcuno fa diventare (causa esterna)\n- Example: \"I get bored\" vs \"It makes me bored\"\n---"]], "p": 1}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "used to + base verb", "d": [["Tempo", "passato"], ["Significato", "abitudine passata (ora non più)"], ["Esempio", "I used to wake up early."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "would + base verb", "d": [["Tempo", "passato"], ["Significato", "abitudine passata (solo azioni, non stati)"], ["Esempio", "We would go to the beach every summer."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "be used to + -ing/noun", "d": [["Tempo", "presente"], ["Significato", "stato: essere abituati"], ["Esempio", "I'm used to waking up early."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "get used to + -ing/noun", "d": [["Tempo", "processo"], ["Significato", "adattamento in corso"], ["Esempio", "I'm getting used to the new schedule."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "used to + base verb (abitudine passata)", "d": [["\"to\" è...", "parte dell'infinito → segue base verb"]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "be used to + -ing (stato attuale)", "d": [["\"to\" è...", "preposizione → segue -ing o sostantivo"]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "get used to + -ing (processo)", "d": [["\"to\" è...", "preposizione → segue -ing o sostantivo"]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "Da bambino giocavo a calcio", "d": [["Inglese", "I used to play football as a kid."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "Da bambino andavo al mare ogni estate", "d": [["Inglese", "I would go to the seaside every summer."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "Sono abituato a lavorare la sera", "d": [["Inglese", "I'm used to working in the evening."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "Mi sto abituando al freddo", "d": [["Inglese", "I'm getting used to the cold."]]}, {"c": "Used To / Would / Be Used To / Get Used To", "s": "VERB FORMS", "t": "Used To / Would / Be Used To / Get Used To", "d": [["", "Tre strutture facili da confondere — la distinzione è cruciale a livello C1.\n**Esempi a confronto:**\n- *I **used to live** in Rome.* = vivevo a Roma (ora non più)\n- *I'**m used to living** in Rome.* = sono abituato a vivere a Roma (ora)\n- *I'**m getting used to living** in Rome.* = mi sto abituando a vivere a Roma\n**Differenza cruciale used to vs would:**\n- **used to** = abitudini + stati passati (versatile)\n- **would** = solo azioni ripetute, MAI stati\n❌ *I would live in London.* (stato — non funziona)\n✅ *I used to live in London.* ✅\n**Trappola — il \"to\":**\nIl *to* funziona in modo diverso ne"]], "p": 1}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "good / well", "d": [["Comparativo", "better"], ["Superlativo", "the best"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "bad", "d": [["Comparativo", "worse"], ["Superlativo", "the worst"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "little", "d": [["Comparativo", "less"], ["Superlativo", "the least"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "many / much", "d": [["Comparativo", "more"], ["Superlativo", "the most"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "far", "d": [["Comparativo", "farther / further"], ["Superlativo", "the farthest / furthest"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "fairly easier", "d": [["✅ Naturale", "much easier"], ["Registro", "neutro"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "very easier", "d": [["✅ Naturale", "far easier"], ["Registro", "enfatico"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "really easier", "d": [["✅ Naturale", "way easier"], ["Registro", "informale"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "more easier", "d": [["✅ Naturale", "a lot easier"], ["Registro", "colloquiale"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "pretty easier", "d": [["✅ Naturale", "considerably easier"], ["Registro", "formale"]]}, {"c": "Comparatives & Superlatives", "s": "VERB FORMS", "t": "Comparatives & Superlatives", "d": [["", "**Forme base:**\n- **Comparativo:** MORE / -ER + THAN → *bigger than, more interesting than*\n- **Superlativo:** THE MOST / THE -EST → *the biggest, the most interesting*\n**Forme irregolari:**\n---\n**Intensificatori del Comparativo (B2 → C1)**\n⚠️ *very, fairly, really, pretty* + comparativo **NON funzionano**. Servono intensificatori specifici:\n**Esempi:**\n- It would be **much** easier now.\n- The new system is **far** more efficient.\n- This route is **way** faster.\n- The result was **considerably** better than expected.\n**Nota:** *way* funziona anche con *too*: *way too expensive* = decisamente t"]], "p": 1}, {"c": "Milestones — Past Perfect Structures", "s": "VERB FORMS", "t": "By the time I was + number", "d": [["Uso", "entro una certa età"], ["Esempio", "By the time I was 15, I had already lived in three cities."]]}, {"c": "Milestones — Past Perfect Structures", "s": "VERB FORMS", "t": "By age + number", "d": [["Uso", "entro una certa età"], ["Esempio", "By age 20, I had completed my first marathon."]]}, {"c": "Milestones — Past Perfect Structures", "s": "VERB FORMS", "t": "It wasn't until I was + number", "d": [["Uso", "non prima di una certa età"], ["Esempio", "It wasn't until I was 30 that I started my own business."]]}, {"c": "Milestones — Past Perfect Structures", "s": "VERB FORMS", "t": "Before I…, I had already…", "d": [["Uso", "sequenza di eventi passati"], ["Esempio", "Before I moved to London, I had never lived alone."]]}, {"c": "Milestones — Past Perfect Structures", "s": "VERB FORMS", "t": "Milestones — Past Perfect Structures", "d": [["", "Per descrivere traguardi e tappe della vita usando il **past perfect**:\n**Nota:** queste strutture usano sempre il **past perfect (had + PP)** perché descrivono un evento avvenuto prima di un altro momento nel passato."]], "p": 1}, {"c": "Time Expressions & \"Be Due\"", "s": "VERB FORMS", "t": "Time Expressions & \"Be Due\"", "d": [["", "**this time + tomorrow / yesterday / next year / last week** — indica un momento preciso rispetto ad ora (futuro o passato):\n- This time tomorrow, I'll be on the plane.\n- This time last year, we were in Rome.\n**something + to be due + time** — *be due* = essere previsto / atteso / in scadenza per un certo momento:\n- The train is due at 6 p.m.\n- The report is due next week.\n- She's due to arrive any minute."]], "p": 1}, {"c": "RELATIVE CLAUSES", "s": "VERB FORMS", "t": "who", "d": [["Uso", "persone (nel parlato whom se è OGGETTO della relativa)"], ["Esempio", "The colleague who called me is on holiday."]]}, {"c": "RELATIVE CLAUSES", "s": "VERB FORMS", "t": "which", "d": [["Uso", "cose"], ["Esempio", "The report which arrived yesterday is wrong."]]}, {"c": "RELATIVE CLAUSES", "s": "VERB FORMS", "t": "that", "d": [["Uso", "persone e cose (meno formale)"], ["Esempio", "The email that you sent got lost."]]}, {"c": "RELATIVE CLAUSES", "s": "VERB FORMS", "t": "whose", "d": [["Uso", "possesso — sempre seguito da un NOME"], ["Esempio", "The client whose contract expired called back."]]}, {"c": "RELATIVE CLAUSES", "s": "VERB FORMS", "t": "when / where", "d": [["Uso", "avverbi relativi (tempo e luogo); sostituibili con preposition + which"], ["Esempio", "the day when we met = the day on which we met"]]}, {"c": "RELATIVE CLAUSES", "s": "VERB FORMS", "t": "what", "d": [["Uso", "= the thing(s) which — ⚠ è nome e pronome relativo insieme, non si appoggia a un nome precedente"], ["Esempio", "I didn't understand what he meant."]]}, {"c": "RELATIVE CLAUSES", "s": "VERB FORMS", "t": "RELATIVE CLAUSES", "d": [["", "**Omissione del pronome:** si può togliere quando il pronome relativo è l'**oggetto** della relativa. · *The email (that) you sent got lost.* — ma non quando è soggetto: *The email **that** arrived is wrong.*\n**Posizione della preposizione** (con *which, who/whom, that* — mai con *whose*): all'inizio = più formale (*the person to whom I spoke*), alla fine = più parlato (*the person I spoke to*).\n**Defining relative clause:** definisce di quale cosa o persona si sta parlando — nessuna virgola. Se le informazioni sono accessorie (non-defining) vanno tra virgole: *My boss, who lives in Rome, is o"]], "p": 1}, {"c": "BRING vs TAKE — la direzione decide il verbo", "s": "VERB FORMS", "t": "BRING", "d": [["Direzione", "avvicinamento: verso chi parla, verso chi ascolta, o verso il luogo dove entrambi saranno"], ["Esempi", "Bring your laptop to the meeting. · Can I bring anything?"]]}, {"c": "BRING vs TAKE — la direzione decide il verbo", "s": "VERB FORMS", "t": "TAKE", "d": [["Direzione", "allontanamento: via dal punto in cui si trova chi parla o chi ascolta"], ["Esempi", "Take these files to the archive. · I'll take you home."]]}, {"c": "BRING vs TAKE — la direzione decide il verbo", "s": "VERB FORMS", "t": "BRING vs TAKE — la direzione decide il verbo", "d": [["", "La scelta non dipende dall'oggetto ma dalla **posizione di chi parla e di chi ascolta** nel momento in cui si parla, e dalla direzione del movimento.\n⚠ Trappola italofona: *portare* copre entrambi, quindi in inglese la direzione va scelta ogni volta.\n---"]], "p": 1}, {"c": "AS vs LIKE", "s": "VERB FORMS", "t": "LIKE + nome / pronome", "d": [["Vale per", "somiglianza: simile a"], ["Esempi", "She sings like a professional. · A town like Cagli."]]}, {"c": "AS vs LIKE", "s": "VERB FORMS", "t": "AS + nome", "d": [["Vale per", "ruolo effettivo: in qualità di"], ["Esempi", "He works as a consultant. · I'm speaking as a friend."]]}, {"c": "AS vs LIKE", "s": "VERB FORMS", "t": "AS + frase", "d": [["Vale per", "come (seguito da verbo)"], ["Esempi", "As I said, it's not urgent. · Do as you like."]]}, {"c": "AS vs LIKE", "s": "VERB FORMS", "t": "AS vs LIKE", "d": [["", "**Test lampo:** se regge \"in qualità di\" → **as**; se è un paragone → **like**. Se dopo c'è un verbo → **as**.\n---"]], "p": 1}, {"c": "MORE vs THE MOST", "s": "VERB FORMS", "t": "MORE vs THE MOST", "d": [["", "*More* vive in coppia: chiediti sempre **more than what?**\n- C'è il secondo termine → **more … than X** · *This option is more flexible than the other.*\n- Non c'è, o il confronto è dentro un gruppo chiuso (*of all, in my life, ever, the one that…*) → **the most** · *It's the most useful tool I've ever used.*\n- *More* da solo su quantità → **more than once / several times.**\n---"]], "p": 1}, {"c": "Correlativa: THE …ER, THE …ER", "s": "VERB FORMS", "t": "Correlativa: THE …ER, THE …ER", "d": [["", "Due comparativi che si muovono insieme: **the + comparativo + soggetto + verbo, the + comparativo + soggetto + verbo.**\n- *The older I get, the harder it becomes.* (❌ *becomes more difficult the more I get older*)\n- *The sooner we start, the better.* · *The more you practise, the easier it gets.*\n⚠ Trappola italofona: l'italiano mette il *più* dopo («diventa più difficile più invecchio»); l'inglese mette **the + comparativo all'inizio di entrambe le metà**.\n---"]], "p": 1}, {"c": "ARTICOLI con i nomi astratti — la regola del \"quale?\"", "s": "VERB FORMS", "t": "ARTICOLI con i nomi astratti — la regola del \"quale?\"", "d": [["", "***The*** **significa \"quello lì\"**: se non puoi rispondere alla domanda «quale?», l'articolo non ci va.\n- ❌ *the AI is changing the society* → ✅ **AI is changing society** (astratti in generale: articolo zero)\n- ✅ *the AI we deployed last year* (quale? quella che abbiamo installato → articolo giusto)\nVale per tutti gli astratti e i concetti generali: *life, work, technology, journalism, soft skills, music*.\n---"]], "p": 1}, {"c": "Sport: GO / PLAY / DO", "s": "VERB FORMS", "t": "GO + -ing", "d": [["Criterio", "sport di movimento / acquatici, in -ing"], ["Esempi", "go swimming, go cycling, go running"]]}, {"c": "Sport: GO / PLAY / DO", "s": "VERB FORMS", "t": "PLAY", "d": [["Criterio", "sport con palla / di squadra / competitivi"], ["Esempi", "play volleyball, play tennis, play basketball, play rugby"]]}, {"c": "Sport: GO / PLAY / DO", "s": "VERB FORMS", "t": "DO", "d": [["Criterio", "senza palla / individuali / palestra / marziali"], ["Esempi", "do yoga, do judo, do gymnastics, do athletics"]]}, {"c": "VOCABULARY C1", "s": "VOCABULARY C1", "t": "aftermath", "d": [["Part of Speech", "noun"], ["Meaning", "consequences, what follows a (negative) event"], ["Example", "In the aftermath of the crisis, many companies had to restructure."]]}, {"c": "VOCABULARY C1", "s": "VOCABULARY C1", "t": "anguish", "d": [["Part of Speech", "noun"], ["Meaning", "deep distress, agony"], ["Example", "The uncertainty caused her considerable anguish."]]}, {"c": "VOCABULARY C1", "s": "VOCABULARY C1", "t": "awareness", "d": [["Part of Speech", "noun"], ["Meaning", "consciousness, knowledge of a situation"], ["Example", "Public awareness of climate change has grown significantly in recent years."]]}, {"c": "VOCABULARY C1", "s": "VOCABULARY C1", "t": "benchmark", "d": [["Part of Speech", "noun"], ["Meaning", "reference point, standard"], ["Example", "This report sets a new benchmark for environmental accountability."]]}, {"c": "VOCABULARY C1", "s": "VOCABULARY C1", "t": "benign", "d": [["Part of Speech", "adjective"], ["Meaning", "harmless, gentle (also medical: non-cancerous)"], ["Example", "The tumour turned out to be benign."]]}, {"c": "VOCABULARY C1", "s": "VOCABULARY C1", "t": "bespoke", "d": [["Part of Speech", "adjective"], ind if...? / Would you mind if...? (+ ING)\n- Be my guest = prego, fai pure → \"Go ahead\""]], "p": 1}, {"c": "Making Requests", "s": "USEFUL EXPRESSIONS FROM HANDWRITTEN NOTES", "t": "Making Requests", "d": [["", "- Can you help me [VERB]? (with HELP, no TO)\n- Do you mind if...? = ti spiace se... (most common way to ask)\n- Would you mind if...? = ti spiacerebbe se...\n- I'd be happy to = sarei lieto di farlo\n- I trust your eye = mi fido del tuo occhio"]], "p": 1}, {"c": "Giving Thanks", "s": "USEFUL EXPRESSIONS FROM HANDWRITTEN NOTES", "t": "Giving Thanks", "d": [["", "- I'm glad I could help = mi fa piacere averti aiutato\n- I enjoyed working on it together.\n- I owe you one = a buon rendere / te ne devo una\n- How can I repay you?\n- I'm grateful for your help.\n- That's what friends are for = a questo servono gli amici.\n- Helpful = useful (both = utile)"]], "p": 1}, {"c": "Saying Sorry (extended)", "s": "USEFUL EXPRESSIONS FROM HANDWRITTEN NOTES", "t": "Saying Sorry (extended)", "d": [["", "- I'm sorry for [ING-FORM]...\n- I didn't mean to. / I didn't intend to.\n- It just slipped.\n- How can I make it up to you? (informal)\n- I'll make it right. (formal)\n- I promise it won't happen again."]], "p": 1}, {"c": "Describing Expectations", "s": "USEFUL EXPRESSIONS FROM HANDWRITTEN NOTES", "t": "Describing Expectations", "d": [["", "- It is supposed to be like... = come dovrebbe essere / come ti aspetti che sia\n- To be meant to = avere lo scopo di / è previsto che\n- To be supposed to = essere tenuto a / previsto che (esprime il senso del \"dovrebbe\") — più neutro di MUST, più obbligo/aspettativa di SHOULD\n- I'm supposed to leave soon = è previsto che me ne vada presto\n- He is meant to ask before he does that = avrebbe dovuto chiedere prima"]], "p": 1}, {"c": "Making Promises", "s": "USEFUL EXPRESSIONS FROM HANDWRITTEN NOTES", "t": "Making Promises", "d": [["", "- You have my word!\n- I pinky promise = equivale a \"mignolino-mignolino\"\n- I swear on [somethi const GROUPS = ["Phrasal","Idioms","Magic Words","Chunks","Parole","Confusabili","Grammatica","Altro"];
let active = null;

function groupOf(e){
  const s = ((e.s || '') + ' ' + (e.c || '')).toUpperCase();
  if(s.indexOf('PHRASAL') >= 0) return 'Phrasal';
  if(s.indexOf('IDIOM') >= 0) return 'Idioms';
  if(s.indexOf('MAGIC') >= 0) return 'Magic Words';
  if(s.indexOf('CHUNK') >= 0 || s.indexOf('REFLEX') >= 0 || s.indexOf('SOFTENER') >= 0) return 'Chunks';
  if(s.indexOf('CONFUSABL') >= 0 || s.indexOf('FALSE FRIEND') >= 0) return 'Confusabili';
  if(s.indexOf('VOCABULARY') >= 0 || s.indexOf('WORD') >= 0) return 'Parole';
  if(s.indexOf('VERB FORM') >= 0 || s.indexOf('GRAMMAR') >= 0 || s.indexOf('CONDITION') >= 0 ||
     s.indexOf('MODAL') >= 0 || s.indexOf('TENSE') >= 0) return 'Grammatica';
  return 'Altro';
}
const STRIP = ['come si dice','come si traduce','come si traducono','cosa significa',
  'che cosa significa','cosa vuol dire','che vuol dire','vuol dire','significa','significano',
  'mi ricordi','il phrasal','la phrasal','l idiom','idiom','la parola','il chunk','il verbo',
  'in inglese','in italiano','qual e','quale','what does','what is','how do you say','how to say',
  'mean','means','meaning','esempio','esempi','frase','frasi'];
const SW = new Set(['il','lo','la','le','gli','un','uno','una','di','del','della','dei','delle',
  'da','in','nel','nella','con','su','sul','per','tra','fra','al','allo','alla','ai','agli','alle',
  'che','chi','non','si','mi','ti','ci','vi','ne','se','ma','come','pi','i','e','o','ed','ad',
  'ho','ha','hai','sono','the','a','an','of','to',
  'on','at','is','are','be','do','does','it','you','my','and','or','for',
  'qualcosa','qualcuno','something','someone','somebody','sth','sb','cosa','cose']);
function norm(s){
  return String(s).toLowerCase().replace(/[\u2018\u2019]/g, "'")
    .replace(/[^a-z0-9\u00e0\u00e8\u00e9\u00ec\u00f2\u00f9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function clean(q){
  let s = ' ' + norm(q) + ' ';
  for(const p of STRIP) s = s.split(' ' + p + ' ').join(' ');
  return s.replace(/\s+/g, ' ').trim();
}
function words(s){ return norm(s).split(' ').filter(Boolean); }
function tok(s){ return words(s).filter(function(w){ return !SW.has(w); }); }
function radice(w){
  var s = w.replace(/(?:mente|zione|arsi|ersi|irsi|ando|endo|are|ere|ire|ato|ata|ati|ate|uto|ito|ita)$/, '');
  return s.length >= 4 ? s : w;
}
function near1(a, b){
  if(a === b) return true;
  if(Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 4) return false;
  if(a[0] !== b[0]) return false;      // un refuso non aggiunge una lettera in testa: alzare != balzare
  var i = 0, j = 0, diff = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++diff > 1) return false;
    if(a.length > b.length) i++; else if(b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
function commonPrefix(a, b){
  var n = Math.min(a.length, b.length), i = 0;
  while(i < n && a[i] === b[i]) i++;
  return i;
}
function wordHit(w, t){
  if(w === t) return 2;
  if(t.length >= 4 && w.length >= 4 && (w.indexOf(t) === 0 || t.indexOf(w) === 0)) return 1.5;
  if(radice(w) === radice(t) && radice(w).length >= 4) return 1.5;
  if(commonPrefix(w, t) >= 5) return 1.5;          // rimando ~ rimandare
  if(near1(w, t)) return 1;                        // refusi
  return 0;
}
function fields(e){
  var mean = [], ex = [], other = [];
  for(var k = 0; k < e.d.length; k++){
    var lab = e.d[k][0] || '', val = e.d[k][1];
    if(/mean|sens|differenz|signific|note/i.test(lab)) mean = mean.concat(words(val));
    else if(/exampl|esempi/i.test(lab)) ex = ex.concat(words(val));
    else other = other.concat(words(val));
  }
  if(!mean.length && !ex.length && other.length){ mean = other; other = []; }
  return {mean: mean, ex: ex, other: other};
}
function bestIn(list, t){
  var best = 0;
  for(var i = 0; i < list.length; i++){ var h = wordHit(list[i], t); if(h > best) best = h; }
  return best;
}
var lastCover = 0;
function score(e, toks, phrase){
  if(!toks.length) return 0;
  var termW = words(e.t), f = fields(e), s = 0, matched = 0;
  for(var i = 0; i < toks.length; i++){
    var t = toks[i];
    var m = Math.max(bestIn(termW, t) * 16, bestIn(f.mean, t) * 11,
                     bestIn(f.other, t) * 5, bestIn(f.ex, t) * 3);
    if(m > 0) matched++;
    s += m;
  }
  if(!matched) return 0;
  var cover = matched / toks.length;
  s *= cover;
  if(cover < 0.6) s = Math.min(s, 13);        // copertura parziale: mai 'corrispondenza netta'
  if(phrase && phrase.length >= 4){
    var termS = ' ' + termW.join(' ') + ' ', meanS = ' ' + f.mean.join(' ') + ' ';
    if(termS.indexOf(' ' + phrase + ' ') >= 0) s += 60;
    else if(meanS.indexOf(' ' + phrase + ' ') >= 0) s += 40;
  }
  return s;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hi(txt, toks){
  var segs = String(txt).split(/([a-zA-Z0-9\u00e0\u00e8\u00e9\u00ec\u00f2\u00f9']+)/), out = '';
  for(var i = 0; i < segs.length; i++){
    var seg = segs[i];
    if(!seg) continue;
    var low = seg.toLowerCase(), isWord = /^[a-z0-9\u00e0\u00e8\u00e9\u00ec\u00f2\u00f9']+$/.test(low), on = false;
    if(isWord) for(var k = 0; k < toks.length; k++)
      if(toks[k].length >= 3 && wordHit(low, toks[k]) >= 1.5){ on = true; break; }
    out += on ? '<mark>' + esc(seg) + '</mark>' : esc(seg);
  }
  return out;
}
function run(){
  var q = clean(document.getElementById('q').value), toks = tok(q);
  var out = document.getElementById('out');
  if(!toks.length){
    out.innerHTML = '<div class="empty">Scrivi una parola in italiano o in inglese.<br>' +
      KB.length + ' voci: phrasal, idioms, chunks, parole, magic words, confusabili, grammatica.</div>';
    return;
  }
  var res = KB.map(function(e){ return {e: e, s: score(e, toks, q)}; }).filter(function(x){ return x.s > 0; });
  if(active) res = res.filter(function(x){ return groupOf(x.e) === active; });
  res.sort(function(a, b){ return b.s - a.s || a.e.t.length - b.e.t.length; });
  var strong = res.filter(function(x){ return x.s >= 14; });
  var shown = (strong.length ? strong : res).slice(0, 30);
  if(!shown.length){
    out.innerHTML = '<div class="empty">Nessuna voce trovata per <b>' + esc(q) + '</b>.<br>' +
      'Prova con una parola sola, con un sinonimo, o con il termine inglese.</div>';
    return;
  }
  var head = strong.length ? '' :
    '<div class="weak">Nessuna corrispondenza netta: ecco le voci pi\u00f9 vicine.</div>';
  out.innerHTML = head + shown.map(function(x){
    var e = x.e, g = groupOf(e), sub = (e.c || e.s);
    var cat = (sub && sub.toUpperCase() !== g.toUpperCase()) ? g + ' &middot; ' + esc(sub) : g;
    var rows = e.d.map(function(d){
      return '<div class="row' + (/exampl|esempi/i.test(d[0] || '') ? ' ex' : '') + '">' +
             (d[0] ? '<b>' + esc(d[0]) + '</b>' : '') + hi(d[1], toks) + '</div>';
    }).join('');
    return '<div class="res"><div class="cat">' + cat + '</div>' +
           '<div class="term">' + hi(e.t, toks) + '</div>' + rows + '</div>';
  }).join('');
}
function renderChips(){
  var counts = {};
  for(var i = 0; i < KB.length; i++){ var g = groupOf(KB[i]); counts[g] = (counts[g] || 0) + 1; }
  document.getElementById('chips').innerHTML = GROUPS.filter(function(g){ return counts[g]; })
    .map(function(g){
      return '<button class="chip ' + (active === g ? 'on' : '') + '" data-g="' + g + '">' + g +
             ' <span>' + counts[g] + '</span></button>';
    }).join('');
  var els = document.querySelectorAll('.chip[data-g]');
  for(var k = 0; k < els.length; k++) els[k].onclick = (function(el){
    return function(){ active = (active === el.dataset.g) ? null : el.dataset.g; renderChips(); run(); };
  })(els[k]);
}
document.getElementById('q').addEventListener('input', run);
document.getElementById('clear').onclick = function(){
  document.getElementById('q').value = ''; active = null; renderChips(); run();
};
if(location.protocol === 'https:' && 'serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(function(){});
renderChips(); run();
</script>
